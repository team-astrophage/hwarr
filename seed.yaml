# Seed: Python FastAPI → Go Gin 백엔드 마이그레이션

goal: |
  현재 Python FastAPI + python-socketio + Redis 백엔드(server/)를
  Go Gin 기반 백엔드(server-go/)로 1:1 이전한다.
  프론트엔드(client/) 코드 변경 없이 동일한 REST API 및 Socket.IO 이벤트를 유지한다.
  Socket.IO는 별도 repo에 범용 Go 라이브러리로 직접 구현한다.

constraints:
  - "프론트엔드 코드 변경 금지 — socket.io-client v4.8.3과 완전 호환"
  - "Go 1.22+ 사용"
  - "웹 프레임워크 Gin 사용"
  - "Socket.IO 별도 repo에 범용 Go 라이브러리로 직접 구현 (EIO v4 / SIO v4)"
  - "Redis 기존 Python 서버와 동일한 인스턴스, 동일한 키 구조 공유"
  - "배포 Docker + AWS ECS (기존 Python 서버와 동일한 인프라 구성)"
  - "server-go/ 디렉토리에 배치 (Python server/와 병행 운영 가능)"
  - "새 기능 추가 없음 — 순수 1:1 기능 이식만"
  - "기존 커밋 컨벤션 준수 (feat/fix/refactor 등, 한국어 메시지)"

acceptance_criteria:
  # Phase 1: Go Socket.IO 라이브러리
  - "AC-SIO-01: Engine.IO v4 핸드셰이크 (polling → websocket upgrade) 정상 동작"
  - "AC-SIO-02: Socket.IO v4 패킷 파싱 — EVENT(type 2), ACK(type 3) 처리"
  - "AC-SIO-03: Namespace 지원 (default / 포함)"
  - "AC-SIO-04: Room join/leave/broadcast 기능"
  - "AC-SIO-05: 미들웨어 체인 지원"
  - "AC-SIO-06: Binary payload 지원"
  - "AC-SIO-07: socket.io-client v4.8.3과 연결/이벤트/ACK 호환성 검증 통과"
  # Phase 2: REST API (13개)
  - "AC-REST-01: GET /health — 상태 확인 (connections, engine_running)"
  - "AC-REST-02: POST /api/fire — GPS 좌표로 화재 점화, 그리드 상태 반환"
  - "AC-REST-03: GET /api/grid/{grid_id} — 단일 그리드 셀 상태 조회"
  - "AC-REST-04: GET /api/grid/viewport — 뷰포트 내 활성 화재 일괄 조회"
  - "AC-REST-05: GET /api/news — 실시간 속보 뉴스 피드 (3-tier 위치 매핑)"
  - "AC-REST-06: GET /api/qr — QR 코드 PNG 이미지 생성"
  - "AC-REST-07: GET /api/map/config — 맵 설정 + 사전 정의 화재 위치"
  - "AC-REST-08: GET /api/demo/location — 랜덤 데모 위치 반환"
  - "AC-REST-09: GET /api/demo/locations — 전체 데모 위치 목록"
  - "AC-REST-10: POST /api/demo/fire — 데모 위치에 화재 점화"
  - "AC-REST-11: GET /api/stats — 글로벌 통계 (activeGrids, totalFires, onlineUsers)"
  - "AC-REST-12: GET /api/ranking/today — 오늘의 지역별 방화 랭킹"
  - "AC-REST-13: POST /api/feedback — Discord webhook으로 피드백 전송 (IP 기반 rate limit)"
  # Socket.IO 이벤트 (11개)
  - "AC-SIO-E01: connect — 연결 등록, user_id 기반 재연결 복원, connected ACK 전송"
  - "AC-SIO-E02: disconnect — 연결 해제, room 정리, users:count 브로드캐스트"
  - "AC-SIO-E03: heartbeat — 클라이언트 heartbeat 기록, heartbeat:ack 반환"
  - "AC-SIO-E04: fire:ignite — GPS → 그리드 변환, Redis 등록, 브로드캐스트 (demo 모드 포함)"
  - "AC-SIO-E05: subscribe:viewport — 뷰포트 그리드 room 구독, 현재 화재 상태 반환"
  - "AC-SIO-E06: fire:state — 요청된 그리드 또는 전체 활성 그리드 상태 반환"
  - "AC-SIO-E07: fire (compat) — mock 서버 호환, camelCase fire:update 브로드캐스트"
  - "AC-SIO-E08: get_fires (compat) — 전체 활성 화재 fires:sync 전송"
  - "AC-SIO-E09: chat:join — 글로벌 채팅방 입장, Redis에서 히스토리 로드"
  - "AC-SIO-E10: chat:send — 메시지 검증, Redis 저장, chat:message 브로드캐스트"
  - "AC-SIO-E11: chat:leave — 채팅방 퇴장, chat:presence 업데이트"
  # 백그라운드 작업
  - "AC-BG-01: FireProgressionEngine — 2초 간격 스캔, 스테이지 전환 감지 및 브로드캐스트"
  - "AC-BG-02: FireProgressionEngine — 60초 간격 만료 이벤트 정리"
  - "AC-BG-03: 화재 확산 — FIRE_SPREAD_THRESHOLD(500) 초과 시 8방향 이웃 확산"
  - "AC-BG-04: 소방관 NPC — 스테이지 4+ 도달 시 firefighter:spawn 브로드캐스트"
  - "AC-BG-05: Stale connection reaper — 15초 간격, 30초 무응답 연결 정리"
  # 외부 연동
  - "AC-EXT-01: Discord webhook — 피드백 embed 전송, allowed_mentions 제한"
  - "AC-EXT-02: QR 코드 — go-qrcode 등 라이브러리로 PNG 생성"
  - "AC-EXT-03: GeoJSON spatial index — 행정동 폴리곤 매칭 (orb 또는 S2 라이브러리)"
  # Redis 키 호환성
  - "AC-REDIS-01: fire:{gridId} — Sorted Set, score=만료 타임스탬프"
  - "AC-REDIS-02: active_grids — Set (활성 그리드 ID 추적)"
  - "AC-REDIS-03: chat:global:messages — List (LPUSH, 100개 cap, 1h TTL)"
  - "AC-REDIS-04: stats:total_fires, stats:daily_fires:YYYY-MM-DD — 누적/일별 카운터"
  - "AC-REDIS-05: stats:daily_ranking:YYYY-MM-DD — Sorted Set (지역별 방화 랭킹)"
  - "AC-REDIS-06: feedback:rl:{ip} — rate limit 카운터 (10분 윈도우)"
  # 검증
  - "AC-TEST-01: 기존 Python 테스트 시나리오를 Go 테스트로 포팅하여 통과"
  - "AC-TEST-02: 프론트엔드 E2E 테스트 — REST + Socket.IO 전체 흐름 검증"
  # 배포
  - "AC-DEPLOY-01: Dockerfile 작성 (multi-stage build)"
  - "AC-DEPLOY-02: 기존 ECS 인프라와 동일한 구성으로 배포 가능"

ontology_schema:
  name: HwarrGoMigration
  description: 전국불판 Go 마이그레이션 도메인 모델
  fields:
    - name: grid_id
      type: string
      description: "격자 셀 ID (format: grid_lat:grid_lng)"
    - name: fire_stage
      type: enum
      description: "NONE(0), BULSSSI(1), MODAKBUL(2), HWAJAE(3), DAEHWAJAE(4), JEONSO(5)"
    - name: fire_event
      type: object
      description: "event_id, grid_id, expire_at (Redis Sorted Set score)"
    - name: firefighter_npc
      type: object
      description: "npc_id, grid_id, status, dispatched_at, target_stage"
    - name: chat_message
      type: object
      description: "id, user_id, nickname, avatar, text, timestamp"
    - name: connection_info
      type: object
      description: "sid, connected_at, last_heartbeat, rooms, user_id, reconnect_count"

evaluation_principles:
  - name: api_compatibility
    weight: 0.35
    description: "모든 REST/Socket.IO가 Python과 동일한 요청/응답 형식 유지"
  - name: redis_compatibility
    weight: 0.25
    description: "동일 Redis 인스턴스에서 동일 키 구조로 동작"
  - name: realtime_fidelity
    weight: 0.20
    description: "Socket.IO 브로드캐스트와 Room 구독이 Python과 동등"
  - name: test_coverage
    weight: 0.10
    description: "기존 테스트 포팅 + E2E 테스트 통과"
  - name: operational_parity
    weight: 0.10
    description: "Docker/ECS 배포가 기존 인프라와 동일"

exit_conditions:
  - name: full_api_parity
    description: "모든 REST/Socket.IO 엔드포인트가 기존 서버와 동일하게 동작"
    criteria: "프론트엔드가 코드 변경 없이 새 서버에 연결하여 모든 기능 정상 작동"
  - name: tests_passing
    description: "이식된 Go 테스트가 모두 통과"
    criteria: "Go test 전부 green"
  - name: docker_buildable
    description: "Docker 이미지 빌드 및 실행 가능"
    criteria: "docker build + docker run으로 서버 기동, /health 응답 확인"

