name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: astrophage-hwarr-frontend
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build static assets
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_WS_URL: ${{ secrets.WS_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync client/dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # index.html and JSON manifests: no-cache for instant updates
          aws s3 cp client/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          # Copy any JSON files (e.g., manifest.json) with no-cache
          if compgen -G "client/dist/*.json" > /dev/null; then
            for f in client/dist/*.json; do
              aws s3 cp "$f" "s3://${{ env.S3_BUCKET }}/$(basename $f)" \
                --cache-control "no-cache, no-store, must-revalidate"
            done
          fi

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Notify Discord
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            STATUS="SUCCESS"
            EMOJI="✅"
          else
            COLOR=15158332
            STATUS="FAILED"
            EMOJI="❌"
          fi

          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${EMOJI} Frontend Deploy ${STATUS}\",
                \"description\": \"**Commit:** \`${GITHUB_SHA::7}\`\n**Branch:** \`${GITHUB_REF_NAME}\`\n**By:** ${GITHUB_ACTOR}\",
                \"color\": ${COLOR},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
