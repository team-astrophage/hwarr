name: Docs Auto-Update

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs-update.yml"

concurrency:
  group: docs-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.pull_request.title, '[skip-docs]')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR에서 변경된 파일들:

            ${{ steps.changed.outputs.files }}

            1. 변경된 파일들을 읽고 어떤 내용이 바뀌었는지 파악하세요.
            2. `docs/` 디렉토리에 관련 문서가 있는지 확인하세요.
            3. 관련 문서가 있다면 변경사항을 반영하여 한국어로 업데이트하세요.
            4. 관련 문서가 없지만 새로운 기능이 추가된 경우, 적절한 문서를 한국어로 새로 작성하세요.
            5. 단순 리팩토링이나 스타일 변경만 있는 경우, 문서 업데이트가 불필요하면 아무 변경도 하지 마세요.
            6. docs/ 문서를 업데이트한 경우, README.md의 내용(기술 스택, 프로젝트 구조 등)이 docs/와 일치하는지 확인하고 필요하면 함께 수정하세요.

            문서 작성 시 기존 docs/ 디렉토리의 문서 스타일과 구조를 따라주세요.
            문서를 업데이트했다면 이 PR 브랜치에 커밋하세요.
          allowed_tools: "Read,Write,Edit,Glob,Grep,Bash(git:*)"

      - name: Notify Discord
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            STATUS="SUCCESS"
            EMOJI="✅"
          else
            COLOR=15158332
            STATUS="FAILED"
            EMOJI="❌"
          fi

          PR_URL="${{ github.event.pull_request.html_url }}"
          DESCRIPTION="**PR:** [#${{ github.event.pull_request.number }}](${PR_URL})\n**Branch:** \`${{ github.event.pull_request.head.ref }}\`\n**By:** ${{ github.actor }}"

          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${EMOJI} Docs Update ${STATUS}\",
                \"description\": \"${DESCRIPTION}\",
                \"color\": ${COLOR},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
