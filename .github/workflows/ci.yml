name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        working-directory: server
        run: ruff check .

      - name: Run ruff format check
        working-directory: server
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements-test.txt

      - name: Install dependencies
        run: pip install -r server/requirements-test.txt

      - name: Run tests
        working-directory: server
        run: pytest tests/ -v --tb=short
