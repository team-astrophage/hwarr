name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "server-go/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "server-go/**"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server-go/go.sum

      - name: Run go vet
        working-directory: server-go
        run: go vet ./...

      - name: Check formatting
        working-directory: server-go
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server-go/go.sum

      - name: Run tests
        working-directory: server-go
        run: go test ./... -v
